# ==========================================
# King of Bots - Spring Boot 配置文件
# ==========================================

server:
  port: 8080          # 后端运行端口

spring:
  # ---------- 数据源配置（MySQL） ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kob?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456   # 改成你的 MySQL 密码

  # ---------- Jackson JSON 配置 ----------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ---------- MyBatis-Plus 配置 ----------
mybatis-plus:
  # mapper.xml 位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类包（别名）
  type-aliases-package: com.kob.backend.pojo
  configuration:
    # 开启驼峰命名自动映射（user_name → userName）
    map-underscore-to-camel-case: true
    # SQL 日志（开发时建议打开）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto

# ---------- JWT 配置 ----------
jwt:
  secret: "KOB-JWT-SECRET-KEY-2024-AcWing-KingOfBots"  # JWT 签名密钥
  expiration: 604800000  # 7 天（毫秒）
